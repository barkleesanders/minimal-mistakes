language: ruby
cache: bundler
gemfile: Gemfile
script:
  - bundle exec bundler-audit check --update
  - bundle exec rake -T
  - bundle exec jekyll build --source test --destination test/_site --trace
  - bundle exec ruby scripts/check-site.rb test/_site
branches:
  only:
    # Change this to gh-pages if you're deploying using the gh-pages branch
    - master
rvm:
 - 3.3
